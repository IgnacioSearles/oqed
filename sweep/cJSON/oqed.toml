#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#include "cJSON.h"
int main(void) {
    FILE *f = fopen("oqed_big.json", "rb");
    long len; char *buf; char *out;
    unsigned long long h = 1469598103934665603ULL;
    int iter; int k;
    if (!f) { fprintf(stderr, "no input\n"); return 1; }
    fseek(f, 0, SEEK_END); len = ftell(f); fseek(f, 0, SEEK_SET);
    buf = (char*)malloc((size_t)len + 1);
    if (!buf) return 1;
    if (fread(buf, 1, (size_t)len, f) != (size_t)len) return 1;
    fclose(f); buf[len] = 0;
    for (iter = 0; iter < 300; iter++) {
        cJSON *j = cJSON_Parse(buf);
        if (!j) { fprintf(stderr, "parse failed\\n"); return 1; }
        out = cJSON_PrintUnformatted(j);
        if (!out) { fprintf(stderr, "print failed\\n"); return 1; }
        for (k = 0; out[k] != 0; k++) { h ^= (unsigned long long)(unsigned char)out[k]; h *= 1099511628211ULL; }
        cJSON_Delete(j);
        free(out);
    }
    free(buf);
    printf("%016llx\\n", h);
    return 0;
}
EOF
