build = "rm -f minigzip oqe_input.dat oqe_tmp.dat && $CC -O3 -march=x86-64-v3 -I. -DHAVE_UNISTD_H -DHAVE_STDARG_H -D_LARGEFILE64_SOURCE=1 -D_XOPEN_SOURCE=700 -o minigzip test/minigzip.c adler32.c compress.c crc32.c deflate.c gzclose.c gzlib.c gzread.c gzwrite.c inflate.c infback.c inftrees.c inffast.c trees.c uncompr.c zutil.c && cat adler32.c compress.c crc32.c deflate.c gzclose.c gzlib.c gzread.c gzwrite.c inflate.c infback.c inftrees.c inffast.c trees.c uncompr.c zutil.c zlib.h zutil.h deflate.h inflate.h test/minigzip.c > oqe_input.dat && for i in 1 2 3 4 5; do cat oqe_input.dat oqe_input.dat > oqe_tmp.dat && mv oqe_tmp.dat oqe_input.dat; done && ls -l oqe_input.dat"
run = "for i in 1 2; do ./minigzip -9 -c oqe_input.dat > oqe_c.gz; ./minigzip -d -c oqe_c.gz > oqe_d.dat; cmp -s oqe_input.dat oqe_d.dat || exit 1; done"
