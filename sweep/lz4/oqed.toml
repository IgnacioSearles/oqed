build = 'make clean && make CC="$CC" CFLAGS="-O3 -march=x86-64-v3" -j8 lz4-release && rm -f .oqed_input .oqed_base && cat lib/lz4.c lib/lz4hc.c lib/lz4frame.c lib/xxhash.c programs/lz4cli.c programs/lz4io.c programs/bench.c tests/bench/fullbench.c > .oqed_base && for i in $(seq 1 50); do cat .oqed_base >> .oqed_input; done && rm -f .oqed_base && ls -l .oqed_input'
run = './programs/lz4 -1 -f .oqed_input .oqed_input.lz4 && ./programs/lz4 -d -f .oqed_input.lz4 .oqed_input.dec && cmp .oqed_input .oqed_input.dec && ./programs/lz4 -9 -f .oqed_input .oqed_input_hc.lz4 && ./programs/lz4 -d -f .oqed_input_hc.lz4 .oqed_input_hc.dec && cmp .oqed_input .oqed_input_hc.dec'
