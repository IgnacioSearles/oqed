[project]
name = "oqed-harness"
version = "0.1.0"
description = "Sandboxed runner and timer for oqed candidate machine code"
requires-python = ">=3.12"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
features = ["extension-module"]
module-name = "oqed_harness"

[tool.uv]
# Rebuild the extension when the Rust sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }]
